# Build the patched (dbsp engine-hook) DuckDB wheel for the SaaS backend image.
# Single server target — NOT a distribution matrix. Manual/tag trigger only, so
# normal pushes never run it. Consumes
# patches/v2.0.0-alpha39998-dbsp-txn-callback.patch.
#
# The Python client lives in the separate duckdb/duckdb-python repo (no
# tools/pythonpkg in the engine tree since the 1.2/1.3 split); its
# external/duckdb submodule must pin the same engine commit as ours
# (v2.0.0-alpha39998 = a00803f7). Local equivalent:
# scripts/build_engine_wheel.sh.
#
# The registry lives in the DatabaseInstance ObjectCache, so a hook-built
# extension also loads on a stock engine (it then runs the capture stack);
# the patched wheel is what makes the hook fire.
name: dbsp-duckdb-wheel
on:
  workflow_dispatch: {}
  push:
    tags: ["engine-*"]

jobs:
  wheel:
    runs-on: ubuntu-22.04 # the SaaS server target; add an arm64 runner if needed
    steps:
      - uses: actions/checkout@v4

      - name: Verify engine patch exists
        run: test -f patches/v2.0.0-alpha39998-dbsp-txn-callback.patch

      # Default is the COMMIT Task 10 pinned (duckdb-python "Bump submodule",
      # 2026-09-02), the first commit on main whose external/duckdb gitlink is
      # a00803f7 — the engine this repo's patch is cut against. Never default to
      # `main`: its gitlink moves, so the job would build against an arbitrary
      # engine and upload it under the paired-artifact name. Override via the
      # DUCKDB_PYTHON_REF repository variable only when re-pinning the pair.
      - name: Clone duckdb-python at the matching client ref
        env:
          DUCKDB_PYTHON_REF: ${{ vars.DUCKDB_PYTHON_REF || 'd483a612d1e225c6b9293fd5733a2b76f5109049' }}
        run: |
          # fetch-by-ref, not `clone --branch`: the pinned ref is a raw commit
          # sha and --branch only accepts branch/tag names.
          git init -q ../duckdb-python
          git -C ../duckdb-python remote add origin https://github.com/duckdb/duckdb-python.git
          git -C ../duckdb-python fetch --depth 1 origin "$DUCKDB_PYTHON_REF"
          git -C ../duckdb-python checkout -q --detach FETCH_HEAD
          git -C ../duckdb-python submodule update --init --depth 1 external/duckdb

      # Fail loud on the invariant that actually matters: the client's vendored
      # engine must be the commit our patch is cut against. A moved ref, a stale
      # cache or a hand-set repository variable all land here, not in a wheel.
      - name: Verify the vendored engine is a00803f7
        run: |
          got="$(git -C ../duckdb-python/external/duckdb rev-parse HEAD)"
          want=a00803f7687ca3d7188d417216e288c5c4b22b58
          test "$got" = "$want" || { echo "engine mismatch: got $got, want $want"; exit 1; }

      - name: Apply engine patch to the vendored engine
        run: |
          git -C ../duckdb-python/external/duckdb apply \
            "$GITHUB_WORKSPACE/patches/v2.0.0-alpha39998-dbsp-txn-callback.patch"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build patched wheel (single target)
        working-directory: ../duckdb-python
        env:
          # the client's custom backend only honors OVERRIDE_GIT_DESCRIBE
          # (vX.Y.Z[-postN]); local segments are impossible → fork = .post1.
          # 1.6.0 is the CLIENT series (PyPI ships the alpha engine as
          # duckdb 1.6.0.dev379); 2.0.0 is the engine version, not this one.
          OVERRIDE_GIT_DESCRIBE: "v1.6.0-post1"
          # Required. Without it the package version carries over to the ENGINE
          # too, the library reports itself as 'v1.6.0', and the extension
          # loader — which matches that string exactly — refuses
          # dbsp.duckdb_extension ("built specifically for DuckDB version
          # 'v2.0.0-alpha39998'").
          OVERRIDE_DUCKDB_GIT_DESCRIBE: "v2.0.0-alpha39998"
        run: |
          pip install build
          python -m build --wheel

      # Smoke the pair, not just the wheel: a wheel that imports fine but whose
      # engine version string no longer matches the extension is the failure
      # mode this build has already hit once (see OVERRIDE_DUCKDB_GIT_DESCRIBE).
      - name: Smoke check
        run: |
          pip install ../duckdb-python/dist/*.whl
          python - <<'PY'
          import duckdb
          assert duckdb.__version__.endswith(".post1"), duckdb.__version__
          con = duckdb.connect(config={"allow_unsigned_extensions": "true"})
          con.execute("LOAD 'build/dbsp.duckdb_extension'")
          print(duckdb.__version__, con.sql("pragma version").fetchall())
          con.close()
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: duckdb-dbsp-wheel
          path: ../duckdb-python/dist/*.whl
          retention-days: 30
