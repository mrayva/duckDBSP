# Build the patched (dbsp engine-hook) DuckDB wheel for the SaaS backend image.
# Single server target — NOT a distribution matrix. Manual/tag trigger only, so
# normal pushes never run it. Consumes
# patches/v2.0.0-alpha39998-dbsp-txn-callback.patch.
#
# The Python client lives in the separate duckdb/duckdb-python repo (no
# tools/pythonpkg in the engine tree since the 1.2/1.3 split); its
# external/duckdb submodule must pin the same engine commit as ours
# (v2.0.0-alpha39998 = a00803f7). Local equivalent:
# scripts/build_engine_wheel.sh.
#
# The registry lives in the DatabaseInstance ObjectCache, so a hook-built
# extension also loads on a stock engine (it then runs the capture stack);
# the patched wheel is what makes the hook fire.
name: dbsp-duckdb-wheel
on:
  workflow_dispatch: {}
  push:
    tags: ["engine-*"]

jobs:
  wheel:
    runs-on: ubuntu-22.04 # the SaaS server target; add an arm64 runner if needed
    steps:
      - uses: actions/checkout@v4

      - name: Verify engine patch exists
        run: test -f patches/v2.0.0-alpha39998-dbsp-txn-callback.patch

      # NO DEFAULT ON PURPOSE. Task 10 pins the duckdb-python commit whose
      # external/duckdb gitlink is a00803f7. Defaulting to `main` would build a
      # wheel against whatever engine main happens to point at and upload it
      # under the paired-artifact name, so an unset ref fails the job here.
      - name: Require the pinned client ref
        run: |
          : "${DUCKDB_PYTHON_REF:?set the DUCKDB_PYTHON_REF repository/environment variable to the duckdb-python ref whose external/duckdb gitlink is a00803f7687ca3d7188d417216e288c5c4b22b58 (Task 10 owns this)}"
        env:
          DUCKDB_PYTHON_REF: ${{ vars.DUCKDB_PYTHON_REF }}

      - name: Clone duckdb-python at the matching client ref
        env:
          DUCKDB_PYTHON_REF: ${{ vars.DUCKDB_PYTHON_REF }}
        run: |
          git clone --branch "$DUCKDB_PYTHON_REF" --depth 1 \
            https://github.com/duckdb/duckdb-python.git ../duckdb-python
          git -C ../duckdb-python submodule update --init --depth 1 external/duckdb

      - name: Apply engine patch to the vendored engine
        run: |
          git -C ../duckdb-python/external/duckdb apply \
            "$GITHUB_WORKSPACE/patches/v2.0.0-alpha39998-dbsp-txn-callback.patch"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build patched wheel (single target)
        working-directory: ../duckdb-python
        env:
          # the client's custom backend only honors OVERRIDE_GIT_DESCRIBE
          # (vX.Y.Z[-postN]); local segments are impossible → fork = .post1.
          # 1.6.0 is the CLIENT series (PyPI ships the alpha engine as
          # duckdb 1.6.0.dev379); 2.0.0 is the engine version, not this one.
          OVERRIDE_GIT_DESCRIBE: "v1.6.0-post1"
        run: |
          pip install build
          python -m build --wheel

      - name: Smoke check
        run: |
          pip install ../duckdb-python/dist/*.whl
          python -c "import duckdb; assert duckdb.__version__.endswith('.post1'), duckdb.__version__; print(duckdb.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: duckdb-dbsp-wheel
          path: ../duckdb-python/dist/*.whl
          retention-days: 30
