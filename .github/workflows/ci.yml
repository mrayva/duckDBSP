name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ci-${{ runner.os }}
          max-size: 2G

      - name: Configure
        run: |
          cmake -S test -B test/build_test \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_UBSAN=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build test/build_test --parallel $(nproc)

      - name: Full test suite
        run: ctest --test-dir test/build_test --output-on-failure -j4 --timeout 600
